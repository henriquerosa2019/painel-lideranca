<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Compass / Shield Outer Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-dasharray="16 10" opacity="0.6" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4" />

  <!-- Cardinal points -->
  <circle cx="256" cy="86" r="8" fill="#fbbf24" />
  <circle cx="256" cy="426" r="6" fill="rgba(255,255,255,0.4)" />
  <circle cx="86" cy="256" r="6" fill="rgba(255,255,255,0.4)" />
  <circle cx="426" cy="256" r="6" fill="rgba(255,255,255,0.4)" />

  <!-- Compass Star / Needle -->
  <!-- North (Gold - Executive Vision) -->
  <polygon points="256,120 286,256 256,236" fill="url(#goldGrad)" />
  <polygon points="256,120 226,256 256,236" fill="#f59e0b" />

  <!-- South (Serenity / Grounding) -->
  <polygon points="256,392 286,256 256,276" fill="#475569" />
  <polygon points="256,392 226,256 256,276" fill="#334155" />

  <!-- East & West -->
  <polygon points="392,256 256,226 276,256" fill="#64748b" />
  <polygon points="120,256 256,286 236,256" fill="#94a3b8" />

  <!-- Center Pivot Core -->
  <circle cx="256" cy="256" r="22" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="8" />
  <circle cx="256" cy="256" r="8" fill="#ffffff" />
</svg>
